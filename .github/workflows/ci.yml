name: WeatherGPT CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  # ============================================================
  # JOB 1: Backend & AI Test Suite
  # Runs the full pytest suite against SQLite in CI isolation.
  # ============================================================
  backend-and-ai:
    name: Backend & AI Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest — Backend, AI & Integration Tests
        env:
          ENVIRONMENT: "testing"
          DATABASE_URL: "sqlite:///./test_ci.db"
          SECRET_KEY: "ci-testing-secret-key-12345-do-not-use-in-prod"
          IMD_API_KEY: "ci-mock-imd-api-key"
          OPENAI_API_KEY: "ci-mock-openai-api-key"
          GEMINI_API_KEY: "ci-mock-gemini-api-key"
        run: |
          python -m pytest -v --tb=short --timeout=60 -x -q

      - name: Cleanup CI test database artifact
        if: always()
        run: |
          rm -f test_ci.db
          echo "CI test database cleaned up."

  # ============================================================
  # JOB 2: Frontend Assets & Build Validation
  # Validates static assets, npm scripts, and file integrity.
  # ============================================================
  frontend-and-assets:
    name: Frontend Assets & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci || npm install

      - name: Run frontend lint check
        run: npm run lint

      - name: Build frontend web assets
        run: npm run build:web

      - name: Run frontend asset verification tests
        run: npm test

      - name: Verify static asset integrity
        run: |
          test -f frontend/index.html
          test -f frontend/app.js
          test -f frontend/styles.css
          test -f frontend/manifest.json
          test -f frontend/sw.js
          echo "All 5 required static frontend assets verified successfully."

  # ============================================================
  # JOB 3: Repository Health & Security Audit
  # Enforces .env safety, Dockerfile security posture, and
  # verifies no secrets are committed to the repository.
  # ============================================================
  repository-health:
    name: Repository & Docker Health
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate environment template (.env.example)
        run: |
          test -f .env.example
          echo ".env.example exists and contains only template placeholders."

      - name: Ensure no committed .env credential file
        run: |
          if [ -f .env ]; then
            echo "ERROR: Tracked .env file detected in repository root — this must not be committed!"
            exit 1
          fi
          echo "Environment safety audit passed: no .env credential file found."

      - name: Verify Dockerfile security configuration
        run: |
          test -f Dockerfile
          grep -q "HEALTHCHECK" Dockerfile
          grep -q "USER appuser" Dockerfile
          echo "Dockerfile security posture verified: HEALTHCHECK and non-root USER directives present."

      - name: Audit .env.example for no real credentials
        run: |
          python3 -c "
          import re, sys
          with open('.env.example') as f:
              content = f.read()
          # Flag real Gemini/OpenAI key patterns
          if re.search(r'AIzaSy[A-Za-z0-9_-]{30,}', content):
              print('FAIL: Real Gemini API key in .env.example')
              sys.exit(1)
          if re.search(r'sk-proj-[A-Za-z0-9_-]{20,}', content):
              print('FAIL: Real OpenAI API key in .env.example')
              sys.exit(1)
          print('Secret pattern audit passed for .env.example.')
          "
